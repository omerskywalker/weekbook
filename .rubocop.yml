plugins:
  - rubocop-rails
  - rubocop-performance

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "db/schema.rb"
    - "bin/*"
    - "node_modules/**/*"
    - "vendor/**/*"

Layout/LineLength:
  Max: 100
  Exclude:
    - "config/environments/*.rb"
    - "config/initializers/devise.rb"
    - "db/migrate/*.rb"
    - "db/seeds.rb"
    - "db/seeds/**/*"

Metrics/MethodLength:
  Max: 20
  Exclude:
    - "db/migrate/**/*"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "config/environments/*.rb"
    - "config/initializers/devise.rb"

Style/Documentation:
  Enabled: false

Rails/I18nLocaleTexts:
  Enabled: false

Rails/BulkChangeTable:
  Enabled: false

Metrics/AbcSize:
  Exclude:
    - "db/migrate/**/*"
    - "app/controllers/**/*"
    - "app/jobs/**/*"
